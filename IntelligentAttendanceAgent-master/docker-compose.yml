# docker-compose.yml —— 打包部署考勤问答 Agent 镜像（仅打包运行，不初始化数据）
# 用法：docker compose up -d --build
# 前置：PG 已初始化（建角色/建表/灌数据），见 README：python scripts/setup_db.py
services:
  agent:
    build: .
    container_name: attendance-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
